name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite hashes a password in nearly every fixture; a cheap bcrypt
        # cost factor here only speeds up CI - production keeps the real
        # default of 12, enforced separately for ENVIRONMENT=production.
        run: pytest --tb=short
        env:
          BCRYPT_ROUNDS: "4"

  # The unit suite builds its schema with create_all against SQLite, so it
  # proves the models work and says nothing about whether the migrations do.
  # This job runs them for real, against the database the app deploys onto.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas
        ports: ["5432:5432"]
        # Without this the first migration races the database's own startup.
        options: >-
          --health-cmd "pg_isready -U saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://saas:saas@localhost:5432/saas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base
        # Every revision defines a downgrade (tests/test_migrations.py checks
        # that they exist); this checks they actually run.
        run: alembic downgrade base

      - name: Upgrade again
        # A downgrade that leaves an index or a type behind only shows up on
        # the way back up.
        run: alembic upgrade head

      - name: Check the migrations match the models
        # The two jobs above have a gap between them: the unit suite builds
        # its schema from the models with create_all, and the steps above
        # prove the migrations run. Neither compares the two, so a model
        # changed without a matching migration passes both and is found by
        # the first query against a column production does not have.
        run: python -m app.scripts.check_migration_drift
