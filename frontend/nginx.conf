server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html must never be cached: it carries the references to the
    # content-hashed bundles, so a stale copy pins clients to a dead build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite emits content-hashed filenames here, so these are safe to pin.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every unmatched path is a client-side route, so hand
    # index.html back and let React Router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
